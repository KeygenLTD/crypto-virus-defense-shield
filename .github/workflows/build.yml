name: Build EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE (onefile, tray)
        run: |
          pyinstaller --onefile --noconsole --name CryptoVirusDefenseShield src/interceptor/detector.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v5
        with:
          name: CryptoVirusDefenseShield-windows
          path: dist/CryptoVirusDefenseShield.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: dist/CryptoVirusDefenseShield.exe
